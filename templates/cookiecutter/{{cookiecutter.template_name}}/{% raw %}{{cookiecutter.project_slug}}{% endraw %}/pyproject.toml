{% from "dependencies/pyproject.toml" import project_tooling -%}
[project]
name = "{{cookiecutter.project_slug}}"
version = "{{cookiecutter.version}}"
description = "{{cookiecutter.description}}"
authors = [{ name = "{{cookiecutter.author_name}}", email = "{{cookiecutter.author_email}}" }]
readme = "README.md"
requires-python = ">={{cookiecutter.python_min_version}}"
dependencies = []

{{ project_tooling() }}

# Enable packaging and choose a build backend when defining the project layout.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py{{cookiecutter.python_min_version.replace('.', '')}}"
extend-exclude = ["templates", "site", "reports", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4"]
ignore = ["E203", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml:reports/coverage.xml",
    "--junitxml=reports/junit.xml",
]
norecursedirs = [".*", "templates", "site", "reports", "build", "dist"]

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "*/.venv/*", "*/.tox/*", "*/templates/*", "*/site/*", "*/reports/*",
    "*/build/*", "*/dist/*", "*/test_*.py", "*/conftest.py",
]

[tool.coverage.report]
include_namespace_packages = true
show_missing = true
