site_name: Python Template Collection
site_description: Creating and using the repository's Cookiecutter templates

theme:
  name: material
  features:
    - navigation.tracking
    - content.code.copy

nav:
  - Home: index.md
  - Usage: usage.md
  - Generated projects: generated.md

exclude_docs: |
  sourcecraft/

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

plugins:
  - search
