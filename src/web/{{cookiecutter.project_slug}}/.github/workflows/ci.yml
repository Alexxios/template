name: Default branch checks and Pages artifact

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: "{% raw %}${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}{% endraw %}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "{{cookiecutter.python_version}}"
      - name: Install tools
        id: tools
        run: |
          python -m pip install uv
          make bootstrap
      - name: Lint and check formatting
        run: make lint
      - name: Test with coverage
        if: "{% raw %}${{ !cancelled() && steps.tools.outcome == 'success' }}{% endraw %}"
        run: make test
      - name: Build documentation and assemble Pages site
        id: docs
        if: "{% raw %}${{ !cancelled() && steps.tools.outcome == 'success' }}{% endraw %}"
        run: |
          make docs
          if [ -d reports ]; then
            mkdir -p site/reports
            cp -R reports/. site/reports/
          fi
      - name: Retain test reports
        if: "{% raw %}${{ always() }}{% endraw %}"
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: reports/
          if-no-files-found: warn
      - name: Upload Pages artifact
        if: "{% raw %}${{ !cancelled() && steps.docs.outcome == 'success' }}{% endraw %}"
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/
