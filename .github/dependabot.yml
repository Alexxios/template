version: 2

updates:
  # The template repository's own GitHub workflows, including the shared
  # template-validation.yml. Generated callers contain no external Action refs;
  # pages.yml only generates its trigger list, leaving versions here to Dependabot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Actions used by generated projects are maintained in the template, too.
  # Use directories globs to match the brace-wrapped Cookiecutter folder.
  - package-ecosystem: github-actions
    directories:
      - "/src/*/*cookiecutter.project_slug*/.github/workflows"
      - "/templates/cookiecutter/*cookiecutter.template_name*/*cookiecutter.project_slug*/.github/workflows"
    schedule:
      interval: weekly
    groups:
      template-github-actions:
        patterns: ["*"]

  # Allure CLI used by the generated project's reporting workflow.
  - package-ecosystem: npm
    directories:
      - "/src/*/*cookiecutter.project_slug*/.github"
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      template-reporting:
        patterns: ["*"]

  # Monitoring images used by generated web workspaces.
  - package-ecosystem: docker-compose
    directories:
      - "/src/web/*cookiecutter.project_slug*/infra"
    schedule:
      interval: weekly
    groups:
      template-infrastructure:
        patterns: ["*"]

  # Tools used to generate and validate projects in the outer CI.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      ci-tooling:
        patterns: ["*"]

  # Shared versions used to render Python dependencies into generated projects.
  - package-ecosystem: uv
    directories:
      - "/src/*/templates/dependencies"
      - "/templates/cookiecutter/*cookiecutter.template_name*/templates/dependencies"
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      template-python:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directories:
      - "/"
      - "/src/*/*cookiecutter.project_slug*"
      - "/templates/cookiecutter/*cookiecutter.template_name*/*cookiecutter.project_slug*"
    schedule:
      interval: weekly
    groups:
      template-pre-commit:
        patterns: ["*"]
