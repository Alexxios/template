# Generated by scripts/sync_templates.py; edit templates/validation/github.yml.jinja instead.
name: Validate web

on:
  push:
    branches: [main, master]
    paths:
      - "src/web/**"
      - "tests/web/**"
      - "tests/__init__.py"
      - "tests/support.py"
      - "scripts/sync_templates.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "templates/validation/github.yml.jinja"
      - ".github/workflows/template-validation.yml"
      - ".github/workflows/validate-web.yml"
  pull_request:
    paths:
      - "src/web/**"
      - "tests/web/**"
      - "tests/__init__.py"
      - "tests/support.py"
      - "scripts/sync_templates.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "templates/validation/github.yml.jinja"
      - ".github/workflows/template-validation.yml"
      - ".github/workflows/validate-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/template-validation.yml
    with:
      template: "web"
      package: "web"
      push_workflow: "ci.yml"
      pull_request_workflow: "pull-request.yml"
      push_artifact: "github-pages"
      pull_request_artifact: "check-reports"
      push_artifact_format: "pages"
      enable_pages: true
      documentation_artifact: "documentation"
    secrets:
      CI_GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
