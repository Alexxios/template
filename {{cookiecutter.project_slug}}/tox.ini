[tox]
envlist = __PY_FACTORS__, lint, docs
isolated_build = true

[testenv]
allowlist_externals = poetry
commands_pre = poetry install --with dev --no-root
commands = poetry run pytest

[testenv:lint]
commands_pre = poetry install --with dev --no-root
commands =
    poetry run ruff check src tests
    poetry run ruff format --check src tests

[testenv:docs]
commands_pre = poetry install --with docs --no-root
commands = poetry run mkdocs build --strict
