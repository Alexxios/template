# Dependabot updates this plain uv manifest. Cookiecutter imports the macros below.
[project]
name = "template-project-tooling"
version = "0.1.0"

# {% macro project_dependencies() %}
dependencies = [
    "mashumaro>=3.23",
    "orjson>=3.13.0",
    "structlog>=26.1.0",
    "dishka>=1.10.1",
]
# End of shared runtime dependencies. {% endmacro %}

# {% macro project_tooling() %}
[project.optional-dependencies]
dev = [
    "ruff>=0.17.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-profiling>=1.8.1",
    "pytest-memray>=1.11.0; sys_platform == 'linux' or sys_platform == 'darwin'",
    "coverage>=7.16.2",
    "tox>=4.67.1",
    "pre-commit>=4.7.0",
    "cookiecutter>=2.7.1",
    "allure-pytest>=2.16.2",
    "memray>=1.20.0; sys_platform == 'linux' or sys_platform == 'darwin'",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-with-pdf>=0.9.3",
]

[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"
# End of shared tooling dependencies. {% endmacro %}

[tool.uv]
package = false
