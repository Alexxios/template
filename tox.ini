[tox]
envlist = py314, lint, docs

[testenv]
skip_install = true
allowlist_externals = uv
passenv = UV_*
commands_pre = uv sync --extra dev --extra docs
commands = uv run pytest

[testenv:lint]
commands =
    uv run ruff check scripts/new_template.py tests
    uv run ruff format --check scripts/new_template.py tests

[testenv:docs]
commands = uv run mkdocs build --strict
