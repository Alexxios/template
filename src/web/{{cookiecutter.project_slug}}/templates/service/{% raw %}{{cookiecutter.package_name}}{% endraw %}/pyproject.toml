{% from "dependencies/pyproject.toml" import package_build -%}
[project]
{% raw %}name = {{ cookiecutter.package_name | tojson }}
version = {{ cookiecutter.version | tojson }}
description = {{ cookiecutter.description | tojson }}{% endraw %}
authors = [{ name = "{{cookiecutter.author_name}}", email = "{{cookiecutter.author_email}}" }]
readme = "README.md"
requires-python = ">={{cookiecutter.python_min_version}}"
license = "{% if cookiecutter.license == 'Proprietary' %}LicenseRef-Proprietary{% else %}{{cookiecutter.license}}{% endif %}"
dependencies = ["fastapi", "uvicorn"]

{{ package_build() }}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Load shared workspace hooks while retaining this member's pytest configuration.
addopts = [
    "--confcutdir=../..",
    "--import-mode=importlib",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=html:../../reports/services/{% raw %}{{cookiecutter.package_name}}{% endraw %}/coverage",
    "--cov-report=xml:../../reports/services/{% raw %}{{cookiecutter.package_name}}{% endraw %}/coverage.xml",
    "--cov-report=json:../../reports/services/{% raw %}{{cookiecutter.package_name}}{% endraw %}/coverage.json",
    "--junitxml=../../reports/services/{% raw %}{{cookiecutter.package_name}}{% endraw %}/junit.xml",
    "--alluredir=../../reports/services/{% raw %}{{cookiecutter.package_name}}{% endraw %}/allure-results",
    "--clean-alluredir",
    "--video=retain-on-failure",
    "--output=../../reports/services/{% raw %}{{cookiecutter.package_name}}{% endraw %}/playwright",
]

[tool.coverage.run]
source = ["src"]
data_file = "../../reports/services/{% raw %}{{cookiecutter.package_name}}{% endraw %}/.coverage"
branch = true
relative_files = true

[tool.coverage.report]
include_namespace_packages = true
show_missing = true
