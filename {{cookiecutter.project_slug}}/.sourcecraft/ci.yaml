on:
  push:
    - workflows: [ci]
      filter:
        branches: ["main", "master"]
  pull_request:
    - workflows: [ci]

workflows:
  ci:
    runs_on: serverless
    tasks:
      - name: test
        cubes:
          - name: pytest
            image: cr.yandex/mirror/library/python:{{cookiecutter.python_version}}-slim
            artifacts:
              - allure-report
            script:
              - |
                set -eux
                python -m pip install --upgrade pip
                pip install "poetry>=1.8"
                poetry install --with dev
                poetry run pytest

                # Build a static, self-contained Allure report from the raw results
                # produced by pytest's --alluredir option, and store it as a cube artifact.
                apt-get update && apt-get install -y --no-install-recommends wget ca-certificates
                wget -qO /tmp/allure.tgz https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
                tar -xzf /tmp/allure.tgz -C /opt
                /opt/allure-2.29.0/bin/allure generate allure-results -o allure-report --clean

      - name: lint
        cubes:
          - name: lint
            image: cr.yandex/mirror/library/python:{{cookiecutter.python_version}}-slim
            script:
              - |
                set -eux
                python -m pip install --upgrade pip
                pip install "poetry>=1.8"
                poetry install --with dev --no-root
                poetry run ruff check src tests
                poetry run ruff format --check src tests

      - name: docs
        cubes:
          - name: mkdocs
            image: cr.yandex/mirror/library/python:{{cookiecutter.python_version}}-slim
            script:
              - |
                set -eux
                python -m pip install --upgrade pip
                pip install "poetry>=1.8"
                poetry install --with docs --no-root
                poetry run mkdocs build --strict
