template = "web"

[context]
python_version = "3.14"
python_min_version = "3.14"

[github]
push_workflow = "ci.yml"
pull_request_workflow = "pull-request.yml"
push_artifact = "github-pages"
push_artifact_format = "pages"
pull_request_artifact = "check-reports"
publish_pages = false

[sourcecraft]
workflow = "ci"
artifacts = [
    { task = "check", cube = "tooling", paths = ["reports/junit.xml", "reports/coverage.xml"] },
]
