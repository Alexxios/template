# Generated by scripts/sync_templates.py; edit templates/validation/sourcecraft.yaml.jinja instead.
on:
  push:
    - workflows: [check-repository]
      filter:
        branches: [main, master]
    - workflows: [validate-base]
      filter:
        branches: [main, master]
        paths:
          - "src/base/**"
          - "tests/base/**"
          - "tests/__init__.py"
          - "tests/support.py"
          - "scripts/sync_templates.py"
          - "pyproject.toml"
          - "uv.lock"
          - ".python-version"
          - "templates/validation/sourcecraft.yaml.jinja"
          - "scripts/sourcecraft_repo.py"
  pull_request:
    - workflows: [check-repository]
    - workflows: [validate-base]
      filter:
        paths:
          - "src/base/**"
          - "tests/base/**"
          - "tests/__init__.py"
          - "tests/support.py"
          - "scripts/sync_templates.py"
          - "pyproject.toml"
          - "uv.lock"
          - ".python-version"
          - "templates/validation/sourcecraft.yaml.jinja"
          - "scripts/sourcecraft_repo.py"

workflows:
  check-repository:
    runs_on: serverless
    tasks:
      - name: check
        cubes:
          - name: test-lint-docs
            image: docker.io/library/python:3.14-slim
            script:
              - |
                set -eu
                apt-get update && apt-get install -y --no-install-recommends make
                python -m pip install uv
                make bootstrap
                make check

  validate-base:
    runs_on: serverless
    tasks:
      - name: generate-and-validate
        cubes:
          - name: create-repo
            image: docker.io/library/python:3.14-slim
            env:
              SOURCECRAFT_ORG_SLUG: lexxi-0
              SOURCECRAFT_API_TOKEN: ${{ secrets.ci }}
            script:
              - |
                set -eu
                REPO_SLUG="ci-base-${SOURCECRAFT_ORG_SLUG}-$(date +%s)-$$"
                python scripts/sourcecraft_repo.py create \
                  --org-slug "$SOURCECRAFT_ORG_SLUG" --repo-slug "$REPO_SLUG" \
                  --visibility private --description "Ephemeral base template validation"
                echo "$REPO_SLUG" > .ci_base_repo_slug

          - name: scaffold-and-push
            image: docker.io/library/python:3.14-slim
            env:
              SOURCECRAFT_ORG_SLUG: lexxi-0
              SOURCECRAFT_API_TOKEN: ${{ secrets.ci }}
            script:
              - |
                set -eu
                REPO_SLUG="$(cat .ci_base_repo_slug)"
                TEMPLATE_DIR="$(pwd)"
                PROJECT_DIR="$(mktemp -d)/ci-test-project"
                apt-get update && apt-get install -y --no-install-recommends git make
                python -m pip install uv
                uv sync --extra dev
                uv run python -m tests.base render "$PROJECT_DIR" --ci sourcecraft
                uv run python -m tests.base scaffold "$PROJECT_DIR"
                cd "$PROJECT_DIR"
                test -f .sourcecraft/ci.yaml
                test ! -e .github
                git init -b main
                git config user.name "CI Bot"
                git config user.email "ci@sourcecraft.dev"
                git add -A
                git commit -m "Scaffold base integration fixture"
                git remote add origin "https://git@git.sourcecraft.dev/${SOURCECRAFT_ORG_SLUG}/${REPO_SLUG}.git"
                git -c credential.helper='!f() { echo "username=git"; echo "password=$SOURCECRAFT_API_TOKEN"; }; f' push -u origin main
                touch "$TEMPLATE_DIR/.ci_base_pushed"

          - name: wait-for-ci
            image: docker.io/library/python:3.14-slim
            env:
              SOURCECRAFT_ORG_SLUG: lexxi-0
              SOURCECRAFT_API_TOKEN: ${{ secrets.ci }}
            script:
              - |
                set -eu
                python scripts/sourcecraft_repo.py cicd-wait \
                  --org-slug "$SOURCECRAFT_ORG_SLUG" --repo-slug "$(cat .ci_base_repo_slug)" \
                  --polling-interval 15 --max-attempts 120

          - name: collect-reports
            image: docker.io/library/python:3.14-slim
            if: always()
            env:
              SOURCECRAFT_ORG_SLUG: lexxi-0
              SOURCECRAFT_API_TOKEN: ${{ secrets.ci }}
            script:
              - |
                set -eu
                if [ -f .ci_base_pushed ]; then
                  python scripts/sourcecraft_repo.py cicd-artifacts \
                    --org-slug "$SOURCECRAFT_ORG_SLUG" --repo-slug "$(cat .ci_base_repo_slug)" \
                    --workflow-slug ci --task-slug test --cube-slug allure \
                    --output-dir base-ci
                  test -s base-ci/allure-report/index.html
                  python scripts/sourcecraft_repo.py cicd-artifacts \
                    --org-slug "$SOURCECRAFT_ORG_SLUG" --repo-slug "$(cat .ci_base_repo_slug)" \
                    --workflow-slug ci --task-slug docs --cube-slug mkdocs \
                    --output-dir base-ci
                  test -s base-ci/site/docs.pdf
                fi
            artifacts:
              paths:
                - ./base-ci/allure-report/index.html
                - ./base-ci/site/docs.pdf

          - name: delete-repo
            image: docker.io/library/python:3.14-slim
            if: always()
            env:
              SOURCECRAFT_ORG_SLUG: lexxi-0
              SOURCECRAFT_API_TOKEN: ${{ secrets.ci }}
            script:
              - |
                set -eu
                if [ -f .ci_base_repo_slug ]; then
                  python scripts/sourcecraft_repo.py delete \
                    --org-slug "$SOURCECRAFT_ORG_SLUG" --repo-slug "$(cat .ci_base_repo_slug)"
                fi
