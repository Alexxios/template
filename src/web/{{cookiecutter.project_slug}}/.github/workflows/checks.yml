{% raw %}name: Workspace checks

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      changed-since:
        type: string
        default: ""
    outputs:
      pages-ready:
        value: ${{ jobs.reports.outputs.pages-ready }}

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.members.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "{% endraw %}{{cookiecutter.python_version}}{% raw %}"
      - name: Initialize Pants
        uses: pantsbuild/actions/init-pants@v11
        with:
          pants-ci-config: ""
          get-pants-version: "0.13.2"
          named-caches-hash: ${{ hashFiles('pants.toml') }}
      - id: members
        env:
          CHANGED_SINCE: ${{ inputs.changed-since }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=(::)
          if [ "$PUBLISH" != true ] && [ -n "$CHANGED_SINCE" ]; then
            base=$(git merge-base HEAD "$CHANGED_SINCE")
            # Deleted imports no longer have owners in the current Pants graph.
            # Run everything for deletions, including the old side of renames.
            if git diff --quiet --no-renames --diff-filter=D "$base" --; then
              args=(--changed-since="$base" --changed-dependents=transitive)
            fi
          fi
          targets=$(pants "${args[@]}" list)
          matrix=$(printf '%s\n' "$targets" | jq -Rsc '
            {include: ([split("\n")[]
              | capture("^(?<path>(services|libs)/[^/:]+)[/:]").path]
              + ["integration"] | unique | map({path: ., id: gsub("/"; "-")}))}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "{% endraw %}{{cookiecutter.python_version}}{% raw %}"
      - name: Install tools
        id: tools
        run: |
          python -m pip install uv rust-just
          just bootstrap
      - name: Check generated files
        run: just check-generated
      - name: Build documentation
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: just docs
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: documentation
          path: site/
          if-no-files-found: error

  members:
    name: Check ${{ matrix.path }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      CHECK_SCOPE: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "{% endraw %}{{cookiecutter.python_version}}{% raw %}"
      - name: Install tools
        id: tools
        run: |
          python -m pip install uv rust-just
          just bootstrap
      - name: Lint and formatting
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: just lint "$CHECK_SCOPE"
      - name: Tests, coverage, and Allure results
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: just test "$CHECK_SCOPE"
      - name: Retain scope reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.id }}
          path: reports/
          if-no-files-found: warn

  reports:
    needs: [discover, tooling, members]
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages-ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "{% endraw %}{{cookiecutter.python_version}}{% raw %}"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install reporting tools
        run: |
          python -m pip install uv rust-just
          just bootstrap
          npm install --prefix .github --no-package-lock
      - uses: actions/download-artifact@v8
        with:
          pattern: report-*
          merge-multiple: true
          path: reports/
      - name: Restore Allure history
        id: history
        if: ${{ inputs.publish }}
        uses: actions/cache/restore@v6
        with:
          path: .allure-history/
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: allure-history-${{ github.ref_name }}-
      - name: Build each scope's Allure report
        run: |
          while IFS= read -r member; do
            output="reports/$member"
            mkdir -p "$output/allure-results"
            args=()
            if [ "$PUBLISH" = true ]; then
              history=".allure-history/$member.jsonl"
              mkdir -p "$(dirname "$history")"
              args+=(--history-path "$history")
            fi
            .github/node_modules/.bin/allure awesome "$output/allure-results" \
              --single-file --output "$output/allure" "${args[@]}"
            if [ "$PUBLISH" = true ]; then cp "$history" "$output/history.jsonl"; fi
          done < <(python -c 'import json, os; print("\n".join(row["path"] for row in json.loads(os.environ["MATRIX"])["include"]))')
        env:
          PUBLISH: ${{ inputs.publish }}
          MATRIX: ${{ needs.discover.outputs.matrix }}
      - name: Save Allure history
        if: ${{ inputs.publish }}
        uses: actions/cache/save@v6
        with:
          path: .allure-history/
          key: ${{ steps.history.outputs.cache-primary-key }}
      - name: Build report pages and badges
        run: just reports
      - name: Retain combined reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: reports/
          if-no-files-found: warn
      - uses: actions/download-artifact@v8
        if: ${{ inputs.publish }}
        with:
          name: documentation
          path: site/
      - name: Assemble Pages site
        if: ${{ inputs.publish }}
        run: |
          mkdir -p site/reports
          cp -R reports/. site/reports/
      - name: Upload Pages artifact
        id: pages
        if: ${{ inputs.publish }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/
{% endraw %}
