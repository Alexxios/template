{% from "dependencies/pyproject.toml" import project_tooling -%}
[project]
name = "{{cookiecutter.project_slug}}"
version = "{{cookiecutter.version}}"
description = "{{cookiecutter.description}}"
authors = [{ name = "{{cookiecutter.author_name}}", email = "{{cookiecutter.author_email}}" }]
readme = "README.md"
requires-python = ">={{cookiecutter.python_min_version}}"
dependencies = []

{{ project_tooling() }}

# The root manages tooling; services and libraries are installable workspace members.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "libs/*"]
exclude = ["services/.*", "libs/.*"]

[tool.codegen]
# Public URL of the reports directory deployed by default-branch CI.
reports_url = {{ cookiecutter.reports_url | tojson }}

[tool.ruff]
src = ["services/*/src", "libs/*/src"]
line-length = 100
target-version = "py{{cookiecutter.python_min_version.replace('.', '')}}"
extend-exclude = ["templates", "site", "reports", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4"]
ignore = ["E203", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests", "services/*/tests", "libs/*/tests"]
addopts = "--import-mode=importlib --cov --cov-report=term-missing --cov-report=html:reports/coverage --cov-report=xml:reports/coverage.xml --cov-report=json:reports/coverage.json --junitxml=reports/junit.xml"
norecursedirs = [".*", "templates", "site", "reports", "build", "dist"]

[tool.coverage.run]
source = ["services", "libs"]
branch = true
omit = [
    "*/.venv/*", "*/.tox/*", "*/templates/*", "*/site/*", "*/reports/*",
    "*/build/*", "*/dist/*", "*/tests/*", "*/conftest.py",
]

[tool.coverage.report]
include_namespace_packages = true
show_missing = true
