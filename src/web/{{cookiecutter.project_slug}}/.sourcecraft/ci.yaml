on:
  push:
    - workflows: [ci]
      filter:
        branches: [main, master]
  pull_request:
    - workflows: [ci]

workflows:
  ci:
    runs_on: serverless
    tasks:
      - name: check
        cubes:
          - name: tooling
            image: docker.io/library/python:{{cookiecutter.python_version}}-slim
            script:
              - |
                set -eu
                apt-get update && apt-get install -y --no-install-recommends make
                python -m pip install uv
                make bootstrap
                make check
            artifacts:
              paths:
                - ./reports/junit.xml
                - ./reports/coverage.xml
