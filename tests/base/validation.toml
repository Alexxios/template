template = "base"

[context]
python_version = "3.14"
python_min_version = "3.14"

[github]
push_workflow = "ci.yml"
pull_request_workflow = "pull-request.yml"
push_artifact = "github-pages"
push_artifact_format = "pages"
reports_path = "."
pull_request_artifact = "check-reports"
enable_pages = true

[sourcecraft]
workflow = "ci"
artifacts = [
    { task = "test", cube = "allure", paths = ["allure-report/index.html"] },
    { task = "docs", cube = "mkdocs", paths = ["site/docs.pdf"] },
]
