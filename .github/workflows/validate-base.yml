# Generated by scripts/sync_templates.py; edit templates/validation/github.yml.jinja instead.
name: Validate base

on:
  push:
    branches: [main, master]
    paths:
      - "src/base/**"
      - "tests/base/**"
      - "tests/__init__.py"
      - "tests/support.py"
      - "scripts/sync_templates.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "templates/validation/github.yml.jinja"
      - ".github/workflows/validate-base.yml"
  pull_request:
    paths:
      - "src/base/**"
      - "tests/base/**"
      - "tests/__init__.py"
      - "tests/support.py"
      - "scripts/sync_templates.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "templates/validation/github.yml.jinja"
      - ".github/workflows/validate-base.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      pages-ready: ${{ steps.collect.outputs.pages-ready == 'true' && steps.artifact.outcome == 'success' }}
    env:
      TEMPLATE_MODULE: tests.base
      INNER_WORKFLOW: ${{ github.event_name == 'pull_request' && 'pull-request.yml' || 'ci.yml' }}
      INNER_ARTIFACT: ${{ github.event_name == 'pull_request' && 'check-reports' || 'github-pages' }}
      GH_REPO: ${{ vars.CI_GITHUB_OWNER || github.repository_owner }}/ci-test-base-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check integration credentials
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CI_GITHUB_TOKEN is required to create a repository and run the generated project's CI."
            exit 1
          fi
      - name: Install tooling
        run: |
          python -m pip install uv
          uv sync --extra dev
      - name: Generate and validate project
        run: |
          PROJECT_DIR="$RUNNER_TEMP/template-generation/ci-test-project"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          git config --global user.name "CI Bot"
          git config --global user.email "ci@users.noreply.github.com"
          uv run python -m "$TEMPLATE_MODULE" render "$PROJECT_DIR" --ci github
          cd "$PROJECT_DIR"
          test -f pyproject.toml
          test -f ".github/workflows/$INNER_WORKFLOW"
          test ! -e .sourcecraft
          test ! -e .gitlab-ci.yml

          # Bootstrap the remote before enabling Pages or opening a PR.
          git init -b main
          git add -A
          git commit -m "Initialize integration fixture [skip ci]"
          echo "BASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          uv run python -m "$TEMPLATE_MODULE" scaffold "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          git add -A
          git commit -m "Scaffold additional packages"
          echo "GENERATED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Create temporary GitHub repository
        id: create
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          REPO_VISIBILITY: ${{ github.event.repository.private && 'private' || 'public' }}
        run: |
          gh repo create "$GH_REPO" "--$REPO_VISIBILITY" \
            --description "Ephemeral repo created by CI for template validation"
          echo "created=true" >> "$GITHUB_OUTPUT"
          gh auth setup-git --hostname github.com
          git remote add origin "https://github.com/$GH_REPO.git"
          git push origin "$BASE_COMMIT:refs/heads/main"
          gh repo edit "$GH_REPO" --default-branch main
      - name: Trigger generated project's CI
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git push origin HEAD:refs/heads/ci-checks
            gh pr create --repo "$GH_REPO" --base main --head ci-checks \
              --title "Validate generated project" \
              --body "Integration check for $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            gh api --method POST "repos/$GH_REPO/pages" -f build_type=workflow
            git push origin HEAD:refs/heads/main
          fi
      - name: Wait for generated project CI
        id: wait
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            event=pull_request
            branch=ci-checks
          else
            event=push
            branch=main
          fi
          run_id=""
          for attempt in $(seq 1 36); do
            if run_id="$(gh run list --repo "$GH_REPO" --workflow "$INNER_WORKFLOW" \
              --branch "$branch" --event "$event" --commit "$GENERATED_COMMIT" \
              --json databaseId --jq '.[0].databaseId // empty')" && [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::No $INNER_WORKFLOW run found for $GH_REPO at $GENERATED_COMMIT"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          timeout 40m gh run watch "$run_id" --repo "$GH_REPO" --exit-status --interval 15
      - name: Collect generated project's logs and reports
        id: collect
        if: ${{ always() && steps.wait.outputs.run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          RUN_ID: ${{ steps.wait.outputs.run_id }}
        run: |
          mkdir -p generated-ci/reports
          gh run view "$RUN_ID" --repo "$GH_REPO" --log > generated-ci/run.log \
            || echo "::warning::Could not download the generated CI log."
          gh run download "$RUN_ID" --repo "$GH_REPO" --name "$INNER_ARTIFACT" \
            --dir "$RUNNER_TEMP/inner-reports"
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            tar -xf "$RUNNER_TEMP/inner-reports/artifact.tar" -C generated-ci/reports
            test -s generated-ci/reports/index.html
            echo "pages-ready=true" >> "$GITHUB_OUTPUT"
          else
            cp -R "$RUNNER_TEMP/inner-reports/." generated-ci/reports/
          fi
      - name: Retain generated project's logs and reports
        id: artifact
        if: ${{ always() && steps.wait.outputs.run_id != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: generated-base-ci
          path: generated-ci/
          if-no-files-found: error
      - name: Delete temporary GitHub repository
        if: ${{ always() && steps.create.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: gh repo delete "$GH_REPO" --yes

  publish-reports:
    needs: validate
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
          needs.validate.outputs.pages-ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      queue: max
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: generated-base-ci
          path: generated-ci
      - uses: actions/upload-pages-artifact@v5
        with:
          path: generated-ci/reports
      - uses: actions/deploy-pages@v5
        id: deployment
