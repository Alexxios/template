on:
  push:
    - workflows: [ci]
      filter:
        branches: ["main", "master"]
  pull_request:
    - workflows: [ci]

workflows:
  ci:
    runs_on: serverless
    tasks:
      - name: test
        cubes:
          - name: pytest
            image: docker.io/library/python:{{cookiecutter.python_version}}-slim
            script:
              - |
                set -eux
                pip install --upgrade pip
                pip install uv
                uv sync --extra dev
                # pytest writes raw Allure data into ./allure-results (see --alluredir in pyproject.toml).
                # The results live in the workspace, so the next cube can pick them up.
                uv run pytest

          - name: allure
            image: docker.io/library/node
            script:
              - |
                set -eux
                # Allure 3 CLI is a Node app distributed via npm; run it through npx
                # so no global install is needed. The `awesome` subcommand with
                # --single-file emits one self-contained index.html embedding the
                # whole report, which is convenient to store as a single artifact.
                npx --yes allure@3 awesome allure-results --single-file --output allure-report
            artifacts:
              paths:
                - ./allure-report/index.html

      - name: lint
        cubes:
          - name: lint
            image: cr.yandex/mirror/library/python:{{cookiecutter.python_version}}-slim
            script:
              - |
                set -eux
                pip install --upgrade pip
                pip install uv
                uv sync --extra dev --no-install-project
                uv run ruff check src tests
                uv run ruff format --check src tests

      - name: docs
        cubes:
          - name: mkdocs
            image: docker.io/library/python:{{cookiecutter.python_version}}
            script:
              - |
                set -eux
                # WeasyPrint requires Pango and related system libraries
                apt-get update && apt-get install -y --no-install-recommends \
                  libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
                  libffi-dev libcairo2 libglib2.0-0 fonts-dejavu-core \
                && rm -rf /var/lib/apt/lists/*
                pip install --upgrade pip
                pip install uv
                uv sync --extra docs --no-install-project
                # mkdocs-with-pdf may raise on warnings; the PDF is still written
                # to site/docs.pdf. Use --strict only for the HTML build phase
                # by catching the plugin error and copying the PDF anyway.
                uv run mkdocs build || true
                # Ensure the PDF exists (it's written before the plugin raises)
                test -f site/docs.pdf || { echo "docs.pdf not found"; exit 1; }
            artifacts:
              paths:
                - ./site/docs.pdf
