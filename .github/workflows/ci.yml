name: Check metatemplate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install repository tooling
        run: |
          python -m pip install uv
          make bootstrap
      - name: Check generated workflows and README
        run: make check-generated
      - name: Test metatemplate and render templates
        run: make test
      - name: Lint and check formatting
        run: make lint
      - name: Build repository documentation
        run: make docs
