          - name: create-repo
            image: cr.yandex/mirror/library/python:3.12-slim
            env:
              SOURCECRAFT_ORG_SLUG: lexxi-0
              SOURCECRAFT_LOG_FILE: ./stdout.log
              SOURCECRAFT_API_TOKEN: {{ secrets.ci }}
            script:
              - |
                set -eux
                touch ./stdout.log
                echo "KILLME" > ./stdout.log

                # Create a throwaway repository via the Sourcecraft REST API.
                # A unique slug keeps concurrent CI runs from colliding.
                REPO_SLUG="ci-test-${SOURCECRAFT_ORG_SLUG}-$(date +%s)-$$"

                python scripts/sourcecraft_repo.py create \
                  --org-slug "$SOURCECRAFT_ORG_SLUG" \
                  --repo-slug "$REPO_SLUG" \
                  --visibility private \
                  --description "Ephemeral repo created by CI for template validation"

                # Persist the slug so the downstream delete-repo cube can clean it up.
                echo "$REPO_SLUG" > .ci_repo_slug


          - name: delete-repo
            image: cr.yandex/mirror/library/python:3.12-slim
            env:
              SOURCECRAFT_ORG_SLUG: lexxi-0
              SOURCECRAFT_LOG_FILE: ./stdout.log
            script:
              - |
                set -eux
                touch ./stdout.log
                echo "KILLME" > ./stdout.log

                # Best-effort cleanup: always run, even if earlier steps failed.
                if [ -f .ci_repo_slug ]; then
                  REPO_SLUG="$(cat .ci_repo_slug)"
                  python scripts/sourcecraft_repo.py delete \
                    --org-slug "$SOURCECRAFT_ORG_SLUG" \
                    --repo-slug "$REPO_SLUG" \
                    || echo "warn: failed to delete '$REPO_SLUG' (may already be gone)"
                else
                  echo "info: no .ci_repo_slug file found, nothing to delete"
                fi
            artifacts:
              paths:
                - ./stdout.log
