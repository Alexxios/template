[tox]
envlist = py314, lint, docs

[testenv]
skip_install = true
allowlist_externals = uv
passenv = UV_*
commands_pre = uv sync --extra dev --extra docs
commands =
    uv run python scripts/sync_templates.py --check
    uv run pytest

[testenv:lint]
commands =
    uv run ruff check scripts tests
    uv run ruff format --check scripts tests

[testenv:docs]
commands = uv run mkdocs build --strict
