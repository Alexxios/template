# Plain dependency manifest for Dependabot; imported by the generated template.
[project]
name = "template-web-tooling"
version = "0.1.0"

# {% macro project_dependencies() %}
dependencies = [
    "fastapi>=0.162.0",
    "sqlalchemy>=2.1.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "celery>=5.6.3",
    "structlog>=26.1.0",
    "sentry-sdk>=2.73.0",
    "prometheus-client>=0.26.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-instrumentation-celery>=0.66b1",
]
# End of shared runtime dependencies. {% endmacro %}

# {% macro project_tooling() %}
[dependency-groups]
dev = [
    "cookiecutter>=2.7.1",
    "jinja2>=3.1.6",
    "uv>=0.13.5",
    "ruff>=0.17.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "allure-pytest>=2.16.2",
    "coverage>=7.17.0",
    "pre-commit>=4.7.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]
# End of tooling dependencies. {%- endmacro %}

[tool.uv]
package = false

# {% macro package_build() %}
[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"
# End of build dependencies. {%- endmacro %}
