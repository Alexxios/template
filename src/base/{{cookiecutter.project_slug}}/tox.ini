[tox]
envlist = __PY_FACTORS__, lint, docs
isolated_build = true

[testenv]
allowlist_externals = uv
commands_pre = uv sync --extra dev --no-install-project
commands = uv run pytest

[testenv:lint]
commands_pre = uv sync --extra dev --no-install-project
commands =
    uv run ruff check src tests
    uv run ruff format --check src tests

[testenv:docs]
commands_pre = uv sync --extra docs --no-install-project
commands = uv run mkdocs build --strict
