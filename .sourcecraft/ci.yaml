on:
  push:
    - workflows: [test-template-generation]
  pull_request:
    - workflows: [test-template-generation]

workflows:
  test-template-generation:
    runs_on: serverless # Experimental mode. For other options, see: https://sourcecraft.dev/portal/docs/ru/sourcecraft/ci-cd-ref/workflows
    tasks:
      - name: generate-and-validate
        cubes:
          - name: create-repo
            image: cr.yandex/mirror/library/python:3.12-slim
            env:
              SOURCECRAFT_ORG_SLUG: lexxi-0
              SOURCECRAFT_API_TOKEN: ${{ secrets.ci }}
            script:
              - |
                set -eux

                # Create a throwaway repository via the Sourcecraft REST API.
                # A unique slug keeps concurrent CI runs from colliding.
                REPO_SLUG="ci-test-${SOURCECRAFT_ORG_SLUG}-$(date +%s)-$$"

                python scripts/sourcecraft_repo.py create \
                  --org-slug "$SOURCECRAFT_ORG_SLUG" \
                  --repo-slug "$REPO_SLUG" \
                  --visibility private \
                  --description "Ephemeral repo created by CI for template validation"

                # Persist the slug so downstream cubes can push/clean up.
                echo "$REPO_SLUG" > .ci_repo_slug

          - name: scaffold-and-push
            image: cr.yandex/mirror/library/python:3.12-slim
            env:
              SOURCECRAFT_ORG_SLUG: lexxi-0
              SOURCECRAFT_API_TOKEN: ${{ secrets.ci }}
            script:
              - |
                set -eux

                REPO_SLUG="$(cat .ci_repo_slug)"
                REPO_URL="https://git@git.sourcecraft.dev/${SOURCECRAFT_ORG_SLUG}/${REPO_SLUG}.git"
                echo "$REPO_URL"

                # 1. Tooling
                apt-get update && apt-get install -y --no-install-recommends git
                python -m pip install --upgrade pip
                pip install "poetry>=1.8" "cookiecutter>=2.6"

                # Configure git globally so cookiecutter's init_git hook can commit.
                git config --global user.name "CI Bot"
                git config --global user.email "ci@sourcecraft.dev"

                # 2. Generate project from this template (defaults: ci_sourcecraft=yes, ci_github=no, ci_gitlab=no)
                #    init_git=yes lets the post_gen hook handle git init + add + commit.
                TEMPLATE_DIR="$(pwd)"
                GEN_ROOT="$(mktemp -d)"
                cookiecutter --no-input "$TEMPLATE_DIR" \
                  project_name="CI Test Project" \
                  python_version=3.12 \
                  python_min_version=3.12 \
                  init_git=yes \
                  -o "$GEN_ROOT"
                cd "$GEN_ROOT/ci-test-project"

                # 3. Sanity-check baseline render
                test -f pyproject.toml
                test -d src/ci_test_project
                test -d tests/ci_test_project
                grep -qE 'envlist\s*=\s*py312' tox.ini
                test -f .sourcecraft/ci.yaml
                test ! -e .github
                test ! -e .gitlab-ci.yml

                # 4. Install dev tools so we can run scripts/new_package.py
                poetry install --with dev --no-root

                # 5. Scaffold 3 additional packages via the in-project helper
                poetry run python scripts/new_package.py --no-input package_name=pkg_alpha
                poetry run python scripts/new_package.py --no-input package_name=pkg_beta
                poetry run python scripts/new_package.py --no-input package_name=pkg_gamma

                # 6. Validate filesystem + pyproject registration for the baseline package and all 3 new ones
                for pkg in ci_test_project pkg_alpha pkg_beta pkg_gamma; do
                  test -f "src/$pkg/__init__.py"     || { echo "MISSING src/$pkg/__init__.py";     exit 1; }
                  test -f "src/$pkg/py.typed"        || { echo "MISSING src/$pkg/py.typed";        exit 1; }
                  test -f "tests/$pkg/test_smoke.py" || { echo "MISSING tests/$pkg/test_smoke.py"; exit 1; }
                  test ! -e "tests/$pkg/__init__.py" || { echo "UNEXPECTED tests/$pkg/__init__.py present (breaks src-layout import resolution)"; exit 1; }
                  grep -qE "include\s*=\s*\"$pkg\"" pyproject.toml \
                    || { echo "MISSING $pkg in pyproject.toml packages"; exit 1; }
                done

                # 7. Commit scaffolding changes and push to the temporary repository.
                #    The generated repo's own CI (.sourcecraft/ci.yaml) will handle
                #    pytest, ruff, mkdocs, and tox validation on push.
                git add -v -A
                git commit -v -m "Scaffold additional packages" || true
                git branch -M main
                git remote add origin "$REPO_URL"
                git -c credential.helper='!f() { echo "username=$SOURCECRAFT_USERNAME"; echo "password=$SOURCECRAFT_API_TOKEN"; }; f' push -v -u origin main

          - name: wait-for-ci
            image: cr.yandex/mirror/library/python:3.12-slim
            env:
              SOURCECRAFT_ORG_SLUG: lexxi-0
              SOURCECRAFT_API_TOKEN: ${{ secrets.ci }}
            script:
              - |
                set -eux

                REPO_SLUG="$(cat .ci_repo_slug)"

                # Wait for the CI workflow in the generated repo to complete.
                # The --run-slug is omitted so the script auto-discovers the latest run
                # triggered by the push above.
                python scripts/sourcecraft_repo.py cicd-wait \
                  --org-slug "$SOURCECRAFT_ORG_SLUG" \
                  --repo-slug "$REPO_SLUG" \
                  --polling-interval 15 \
                  --max-attempts 120

                # Pull the single-file Allure report artifact produced by the
                # inner CI's allure cube (workflow=ci, task=test, cube=allure)
                # and store it locally so it becomes an artifact of this cube.
                # The artifact's local_path (./allure-report/index.html) is
                # reconstructed under --output-dir, so we use "." to land at
                # ./allure-report/index.html.
                python scripts/sourcecraft_repo.py cicd-artifacts \
                  --org-slug "$SOURCECRAFT_ORG_SLUG" \
                  --repo-slug "$REPO_SLUG" \
                  --workflow-slug ci \
                  --task-slug test \
                  --cube-slug allure \
                  --output-dir .

                # Pull the mkdocs print-site artifact produced by the
                # inner CI's mkdocs cube (workflow=ci, task=docs, cube=mkdocs)
                # and store it locally so it becomes an artifact of this cube.
                python scripts/sourcecraft_repo.py cicd-artifacts \
                  --org-slug "$SOURCECRAFT_ORG_SLUG" \
                  --repo-slug "$REPO_SLUG" \
                  --workflow-slug ci \
                  --task-slug docs \
                  --cube-slug mkdocs \
                  --output-dir .
            artifacts:
              paths:
                - ./allure-report/index.html
                - ./site/print/index.html

          - name: delete-repo
            image: cr.yandex/mirror/library/python:3.12-slim
            # if: always()
            env:
              SOURCECRAFT_ORG_SLUG: lexxi-0
              SOURCECRAFT_API_TOKEN: ${{ secrets.ci }}
            script:
              - |
                set -eux

                # Best-effort cleanup: always run, even if earlier steps failed.
                if [ -f .ci_repo_slug ]; then
                  REPO_SLUG="$(cat .ci_repo_slug)"
                  python scripts/sourcecraft_repo.py delete \
                    --org-slug "$SOURCECRAFT_ORG_SLUG" \
                    --repo-slug "$REPO_SLUG" \
                    || echo "warn: failed to delete '$REPO_SLUG' (may already be gone)"
                else
                  echo "info: no .ci_repo_slug file found, nothing to delete"
                fi
