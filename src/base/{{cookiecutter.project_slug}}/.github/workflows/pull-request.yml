name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "{{cookiecutter.python_version}}"
      - name: Install dependencies
        run: |
          python -m pip install uv
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libffi-dev libcairo2 libglib2.0-0 fonts-dejavu-core
          uv sync --extra dev --extra docs
      - name: Test with coverage
        run: uv run pytest
      - name: Lint
        run: uv run ruff check src tests
      - name: Check formatting
        run: uv run ruff format --check src tests
      - name: Build documentation PDF
        run: |
          # Match Sourcecraft: the PDF plugin can raise after writing the PDF.
          uv run mkdocs build || test -f site/docs.pdf
          test -s site/docs.pdf
      - name: Upload check reports
        if: "{% raw %}${{ !cancelled() }}{% endraw %}"
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            reports/
            allure-results/
            site/docs.pdf
