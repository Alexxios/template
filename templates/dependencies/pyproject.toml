# Dependabot updates this plain uv manifest. Cookiecutter imports the macro below.
[project]
name = "template-project-tooling"
version = "0.1.0"
dependencies = []

# {% macro project_tooling() %}
[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.6.0",
    "tox>=4.21.0",
    "pre-commit>=4.0.0",
    "cookiecutter>=2.6.0",
    "allure-pytest>=2.13.0",
    "memray>=1.20.0; sys_platform == 'linux' or sys_platform == 'darwin'",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-with-pdf>=0.9.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
# End of shared tooling dependencies. {% endmacro %}

[tool.uv]
package = false
