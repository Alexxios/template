# Plain dependency manifest for Dependabot; imported by the generated template.
[project]
name = "template-web-tooling"
version = "0.1.0"

# {% macro project_tooling() %}
[project.optional-dependencies]
dev = [
    "cookiecutter>=2.7.1",
    "jinja2>=3.1.6",
    "uv>=0.13.5",
    "ruff>=0.17.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "coverage>=7.17.0",
    "pre-commit>=4.7.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]
# End of tooling dependencies. {%- endmacro %}

[tool.uv]
package = false

# {% macro package_build() %}
[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"
# End of build dependencies. {%- endmacro %}
