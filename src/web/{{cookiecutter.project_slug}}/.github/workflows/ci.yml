{% raw %}name: Default branch checks and Pages deployment

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: default-branch-pages
  queue: max
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: ./.github/workflows/checks.yml
    with:
      publish: true

  deploy:
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.pages-ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
{% endraw %}
