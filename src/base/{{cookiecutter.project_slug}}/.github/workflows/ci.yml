name: CI

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  queue: max
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: "{% raw %}${{ steps.deployment.outputs.page_url }}{% endraw %}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "{{cookiecutter.python_version}}"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: |
          python -m pip install uv
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz
          uv sync --extra dev
      - name: Restore Allure history
        id: history
        uses: actions/cache/restore@v6
        with:
          path: reports/history.jsonl
          key: "{% raw %}allure-history-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}{% endraw %}"
          restore-keys: "{% raw %}allure-history-${{ github.ref_name }}-{% endraw %}"
      - name: Test with coverage and profiling
        id: tests
        shell: bash
        run: |
          mkdir -p reports
          uv run pytest --profile-svg --pstats-dir=reports/profiling \
            --memray --memray-bin-path=reports/memory --memray-bin-prefix=pytest \
            --color=no | tee reports/pytest.txt
          test -s reports/profiling/combined.svg
      - name: Build memory flame graphs
        if: "{% raw %}${{ !cancelled() && steps.tests.outcome != 'skipped' }}{% endraw %}"
        run: |
          for capture in reports/memory/*.bin; do
            [ -f "$capture" ] || continue
            uv run memray flamegraph --force -o "${capture%.bin}.html" "$capture"
          done
      - name: Build Allure report
        id: allure
        if: "{% raw %}${{ !cancelled() && steps.tests.outcome != 'skipped' }}{% endraw %}"
        run: |
          npm install --prefix .github --no-package-lock
          .github/node_modules/.bin/allure awesome allure-results --single-file --output allure-report \
            --history-path reports/history.jsonl
          cp -R allure-report/. reports/
      - name: Save Allure history
        if: "{% raw %}${{ !cancelled() && steps.allure.outcome == 'success' }}{% endraw %}"
        uses: actions/cache/save@v6
        with:
          path: reports/history.jsonl
          key: "{% raw %}${{ steps.history.outputs.cache-primary-key }}{% endraw %}"
      - name: Upload reports to Pages
        id: pages
        if: "{% raw %}${{ !cancelled() && steps.tests.outcome != 'skipped' }}{% endraw %}"
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports
      - name: Deploy reports
        id: deployment
        if: "{% raw %}${{ !cancelled() && steps.pages.outcome == 'success' }}{% endraw %}"
        uses: actions/deploy-pages@v5
