name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "{{cookiecutter.python_version}}"
      - run: pip install --upgrade pip uv
      - run: uv sync --extra dev
      - run: uv run pytest
      - uses: actions/setup-node@v7
        if: always()
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build Allure report
        if: always()
        run: |
          if [ -d allure-results ]; then
            npx --yes allure@3 awesome allure-results --single-file --output allure-report
          fi
      - uses: actions/upload-artifact@v4
        id: allure_artifact
        if: always()
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: error
      - name: Post Allure summary to pull request
        if: >-
          !cancelled() &&
          steps.allure_artifact.outcome == 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: allure-framework/allure-action@v0
        with:
          report-directory: ./allure-report
          github-token: "{% raw %}${{ github.token }}{% endraw %}"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "{{cookiecutter.python_version}}"
      - run: pip install --upgrade pip uv
      - run: uv sync --extra dev --no-install-project
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "{{cookiecutter.python_version}}"
      - name: Install PDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libffi-dev libcairo2 libglib2.0-0 fonts-dejavu-core
      - run: pip install --upgrade pip uv
      - run: uv sync --extra docs --no-install-project
      - name: Build documentation PDF
        run: |
          # Match Sourcecraft: the PDF plugin can raise after writing the PDF.
          uv run mkdocs build || test -f site/docs.pdf
          test -s site/docs.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-pdf
          path: site/docs.pdf
          if-no-files-found: error
